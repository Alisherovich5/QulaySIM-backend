# Migrations for the tables THIS service owns.
#
# Django still owns every table it created — orders, catalog, customers,
# content, auth. Nothing in here touches them, and `alembic revision
# --autogenerate` is deliberately not used: it would look at the whole metadata,
# see Django's tables, and propose rewriting them. Revisions are written by hand.
[alembic]
script_location = alembic
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
