name: CI

on:
  # One branch. The list used to name four because the shop ran off whichever
  # was newest, and a branch missing from it was a branch nobody tested — which
  # is the same shape of bug as a test that never runs.
  push: {branches: [main]}
  pull_request:
  # Callable, so the publish workflow can make the image wait for it. Two
  # workflows on the same push run side by side, which meant a failing test
  # suite and a published image were not mutually exclusive — the one thing a
  # pipeline is for.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check app tests
      - name: Format check
        run: ruff format --check app tests
      - name: Types
        run: mypy app

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fastsim
          POSTGRES_USER: fastsim
          POSTGRES_PASSWORD: fastsim
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://fastsim:fastsim@localhost:5432/fastsim
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-only-secret-value-at-least-32-characters-long
      ENVIRONMENT: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev]"

      # Django owns the schema — apply its migrations, then assert the
      # SQLAlchemy models still match. This is the contract between the repos.
      # The same branch when the admin repo has one, its default otherwise.
      # Taking main unconditionally meant CI applied migrations that predate the
      # schema this branch is written against, and every test then failed on a
      # missing column — a failure that says nothing about the code under test.
      - name: Check out admin (schema owner, same branch)
        id: admin_same_branch
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: Alisherovich5/QulaySIM-admin
          path: admin
          ref: ${{ github.ref_name }}
      - name: Check out admin (schema owner, default branch)
        if: steps.admin_same_branch.outcome == 'failure'
        uses: actions/checkout@v4
        with: {repository: Alisherovich5/QulaySIM-admin, path: admin}
      - name: Apply Django migrations
        working-directory: admin
        env:
          DB_NAME: fastsim
          DB_USER: fastsim
          DB_PASSWORD: fastsim
          DB_HOST: localhost
          SECRET_KEY: ci-only
        run: |
          pip install -r requirements.txt
          python manage.py migrate --noinput

      # Then ours. Django owns the tables it created; this repo owns the
      # support tables and brings the hand-made audit/TOTP objects under
      # version control, so CI tests the schema production actually has.
      - name: Apply our migrations
        env:
          DATABASE_URL: postgresql+asyncpg://fastsim:fastsim@localhost:5432/fastsim
          JWT_SECRET: ci-only-secret-value-at-least-32-characters
          REDIS_URL: redis://localhost:6379/0
        run: alembic upgrade head

      # The integration tests need a catalogue to sell from. Without this they
      # fail with "seed the catalogue first", which looks like a broken test and
      # is really a missing fixture — twelve failures that said nothing.
      - name: Seed the catalogue
        run: python -m scripts.seed

      - name: Tests
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=70

  # Proves the image still builds on a pull request, where nothing publishes.
  # On main the publish workflow builds the same thing for real, so building it
  # here too would be the same work twice for no extra signal.
  docker:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: {context: ., push: false, cache-from: "type=gha", cache-to: "type=gha,mode=max"}
