[project]
name = "qulaysim-api"
version = "2.0.0"
description = "QulaySIM eSIM commerce API — storefront, checkout, account and provisioning."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "gunicorn>=22.0",
    "SQLAlchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",          # async engine (API)
    "psycopg[binary]>=3.1",   # sync engine (Celery workers)
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "PyJWT[crypto]>=2.9",
    "bcrypt>=4.1",
    "httpx>=0.27",
    "redis[hiredis]>=5.0",
    "celery[redis]>=5.4",
    "qrcode[pil]>=7.4",
    # Explicit, not transitive: avatars and OG cards render with Pillow
    # directly; leaning on qrcode's [pil] extra meant the image only had it
    # by luck. pillow-heif decodes what iPhones actually shoot — it was added
    # to requirements.txt first, which this image does not install from.
    "Pillow>=10.0",
    "pillow-heif>=0.16",
    "python-multipart>=0.0.9",
    "structlog>=24.1",
    "orjson>=3.10",
    "cryptography>=50.0",   # PYSEC-2026-3552
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-redis",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "ASYNC", "S", "BLE", "RUF"]
ignore = [
    "S101",    # assert — used deliberately in tests
    "B008",    # Depends(...) in defaults is the FastAPI idiom
    "RUF001",  # Uzbek uses U+02BB (Oʻzbekcha); not a homoglyph mistake
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S107"]
# Pydantic evaluates field defaults per-instance; RUF012 does not model that.
"app/schemas/*" = ["RUF012", "S105"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Celery ships no typed decorators; strict mode would flag every task.
module = "app.workers.tasks.*"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole session: the engine and Redis client are
# module-level singletons, so a per-test loop would strand their connections.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
